name: Update Taiwan IPTV playlist

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate merged playlist
        run: python generate_playlist.py
      - name: Commit updated playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '中国台湾省iptv.txt'
          if git diff --cached --quiet; then
            echo 'Playlist is unchanged.'
          else
            git commit -m 'Update merged Taiwan IPTV playlist'
            git push
          fi
